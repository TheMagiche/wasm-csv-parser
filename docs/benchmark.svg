<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <rect width="640" height="220" fill="#f3ecdf"/>
  <text x="24" y="32" fill="#1f1a14" font-family="Georgia, serif" font-size="18">10 MB narrow unquoted CSV, Node</text>
  <text x="24" y="54" fill="#5c5146" font-family="sans-serif" font-size="12">Lower is faster. Full parse() rebuilds JavaScript strings. Flat buffer is the scanner only.</text>
  <g font-family="sans-serif" font-size="13" fill="#1f1a14">
    <text x="24" y="92">Papa Parse</text>
    <rect x="150" y="76" width="274" height="18" rx="4" fill="#8d8174"/>
    <text x="432" y="90">137 ms</text>
    <text x="24" y="128">papa-wasm parse()</text>
    <rect x="150" y="112" width="448" height="18" rx="4" fill="#c4552a"/>
    <text x="24" y="164">flat buffer</text>
    <rect x="150" y="148" width="108" height="18" rx="4" fill="#c4552a"/>
    <text x="266" y="162">54 ms</text>
  </g>
  <text x="430" y="126" fill="#fffaf3" font-family="sans-serif" font-size="12">224 ms</text>
</svg>
