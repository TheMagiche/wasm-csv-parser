[package]
name = "csv-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Papa Parse-compatible CSV parser core. No JavaScript dependency."
readme = "README.md"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2.7"
wasm-bindgen = "0.2.100"

[dev-dependencies]
proptest = "1.5"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
